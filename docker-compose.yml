services:
  backend:
    build:
      context: ./backend
      args:
        INSTALL_ML: "1"
    environment:
      HELIUM_ENV: production
      HELIUM_DATA_DIR: /data
      HELIUM_EMBEDDING_BACKEND: ${HELIUM_EMBEDDING_BACKEND:-auto}
      HELIUM_ENABLE_LLM: ${HELIUM_ENABLE_LLM:-0}
      HELIUM_SEED_DEMO: ${HELIUM_SEED_DEMO:-0}
      HELIUM_DEFAULT_REVIEWER: ${HELIUM_DEFAULT_REVIEWER:-Compliance Reviewer}
      HELIUM_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - helium-data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8000}
    environment:
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  helium-data:
    name: ${HELIUM_DATA_VOLUME:-helium-data}
